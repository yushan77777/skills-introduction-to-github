*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);height:100svh;overflow:hidden}
.pane{min-height:0;min-width:0}

/* ---------- rail ---------- */
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.rail-head{padding:18px 20px 14px;border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:12px}
.wordmark{display:flex;align-items:baseline;gap:8px}
.wordmark strong{font-size:16px;font-weight:600;letter-spacing:-.01em}
.wordmark span{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.progress{display:flex;flex-direction:column;gap:7px}
.progress-line{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:11px;color:var(--ink-2);letter-spacing:.02em}
.progress-line b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.ticks{display:grid;grid-template-columns:repeat(15,1fr);gap:2px}
.tick{height:5px;border-radius:1px;background:var(--line);transition:background .25s ease}
.tick.on{background:var(--ok)}
.rail-list{overflow-y:auto;padding:6px 12px 24px;flex:1}
.level-head{padding:15px 8px 6px;margin-top:9px;border-top:1px solid var(--line-soft);color:var(--ink-3);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.level-head:first-child{margin-top:0;border-top:0}
.level-head i{font-style:normal;color:var(--accent);font-weight:600}
.task-btn{width:100%;display:flex;align-items:center;gap:10px;padding:7px 9px;border:0;border-radius:6px;background:none;cursor:pointer;text-align:left;color:var(--ink-2);transition:background .15s ease,color .15s ease}
.task-btn:hover{background:var(--surface-2);color:var(--ink)}
.task-btn.active{background:var(--accent-soft);color:var(--ink)}
.task-btn.active .task-name{font-weight:600}
.task-num{font-family:var(--mono);font-size:11px;color:var(--ink-3);width:16px;text-align:right;font-variant-numeric:tabular-nums}
.task-btn.active .task-num{color:var(--accent)}
.task-name{flex:1;font-family:var(--mono);font-size:12.5px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.dot.started{background:var(--ochre)}
.dot.done{background:var(--ok)}

/* ---------- main ---------- */
.main{display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--surface)}
.topbar h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.015em}
.topbar h1 code{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--accent)}
.topbar-meta{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.runtime{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.runtime .dot{width:6px;height:6px}
.runtime.ready .dot{background:var(--ok)}
.runtime.failed .dot{background:var(--bad)}
.runtime.loading .dot{background:var(--ochre)}

.body{display:grid;grid-template-columns:minmax(320px,400px) minmax(0,1fr);overflow:hidden}

/* ---------- brief ---------- */
.brief{border-right:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:22px 24px 40px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.brief h2{margin:0 0 4px;font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:-.02em;color:var(--accent)}
.brief-lede{font-family:var(--serif);font-size:15.5px;line-height:1.6;color:var(--ink);margin:14px 0 0;max-width:60ch}
.brief-lede + .brief-lede{margin-top:10px}
.brief-lede code,.hint code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:3px;padding:.06em .3em}
.examples{margin:18px 0 0;border:1px solid var(--line-soft);border-radius:7px;background:var(--code-bg);overflow:hidden}
.examples-head{padding:7px 12px;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.examples pre{margin:0;padding:11px 12px;font-family:var(--mono);font-size:12.5px;line-height:1.75;overflow-x:auto;color:var(--ink)}
.examples .arrow{color:var(--accent)}
.hint{margin:16px 0 0;font-family:var(--serif);font-size:14.5px;line-height:1.6;color:var(--ink-2);max-width:60ch}
details{margin-top:16px;border-top:1px solid var(--line-soft);padding-top:12px}
summary{cursor:pointer;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:7px}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";color:var(--accent);font-weight:600}
details[open] summary::before{content:"–"}
summary:hover{color:var(--ink)}
details pre{margin:12px 0 0;padding:12px;background:var(--code-bg);border:1px solid var(--line-soft);border-radius:7px;font-family:var(--mono);font-size:12.5px;line-height:1.65;overflow-x:auto}

/* ---------- workbench ---------- */
.work{display:grid;grid-template-rows:minmax(0,1.35fr) minmax(0,1fr);overflow:hidden;background:var(--paper)}
.editor-wrap{display:flex;flex-direction:column;overflow:hidden;padding:16px 18px 0}
.editor-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px 9px}
.editor-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.controls{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;font-size:12.5px;transition:border-color .15s ease,color .15s ease,background .15s ease}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn kbd{font-family:var(--mono);font-size:10.5px;opacity:.75;border:0;background:none;padding:0}
.editor{flex:1;display:flex;min-height:0;border:1px solid var(--line);border-radius:8px;background:var(--code-bg);overflow:hidden;box-shadow:var(--shadow)}
.gutter{flex:none;padding:12px 0 12px 12px;font-family:var(--mono);font-size:13px;line-height:1.65;color:var(--ink-3);text-align:right;user-select:none;overflow:hidden;font-variant-numeric:tabular-nums;opacity:.6}
.gutter div{height:calc(13px * 1.65)}
#code{flex:1;min-width:0;padding:12px;border:0;outline:none;resize:none;background:none;color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.65;white-space:pre;overflow:auto;tab-size:4}

/* ---------- console ---------- */
.console{display:flex;flex-direction:column;overflow:hidden;padding:14px 18px 18px;gap:9px}
.console-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.console-head .editor-label{padding:0}
.verdict{font-family:var(--mono);font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
.verdict.pass{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:600}
.verdict.fail{background:var(--bad-soft);border-color:transparent;color:var(--bad);font-weight:600}
.console-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:12px}
.stream,.checks{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:auto;padding:11px 13px}
.stream{font-family:var(--mono);font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.stream .trace{color:var(--bad)}
.placeholder{color:var(--ink-3);font-family:var(--sans);font-size:13px;line-height:1.55}
.check{display:grid;grid-template-columns:14px minmax(0,1fr);gap:9px;padding:6px 0;border-bottom:1px solid var(--line-soft)}
.check:last-child{border-bottom:0}
.check .mark{font-family:var(--mono);font-size:12px;font-weight:600;line-height:1.5}
.check.ok .mark{color:var(--ok)}
.check.no .mark{color:var(--bad)}
.check-label{font-family:var(--mono);font-size:12px;color:var(--ink);word-break:break-word}
.check.ok .check-label{color:var(--ink-2)}
.check-detail{margin-top:3px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px}
.check-detail b{font-weight:500;color:var(--ink-3);letter-spacing:.03em}
.check-detail .got{color:var(--bad)}
.check-detail .want{color:var(--ok)}

.banner{margin:0;padding:10px 22px;background:var(--ochre-soft);color:var(--ochre);font-size:12.5px;border-bottom:1px solid var(--line)}
.banner code{font-family:var(--mono)}

@media (max-width:1180px){
  .shell{grid-template-columns:1fr;height:auto;overflow:visible}
  .rail{border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .rail-list{display:flex;overflow-x:auto;padding:10px 12px;gap:4px;align-items:center}
  .level-head{padding:0 6px 0 10px;margin-top:0;border-top:0;flex:none}
  .level-head hr{display:none}
  .task-btn{width:auto;flex:none;padding:6px 10px}
  .task-name{max-width:150px}
  .main{overflow:visible}
  .body{grid-template-columns:1fr;overflow:visible}
  .brief{border-right:0;border-bottom:1px solid var(--line);overflow:visible;max-height:none}
  .work{overflow:visible}
  .editor{height:340px;flex:none}
  .console-body{min-height:260px}
}
@media (max-width:720px){
  .console-body{grid-template-columns:1fr;min-height:0}
  .stream,.checks{max-height:230px}
  .topbar{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script type="text/x-python" data-task="t3">
def fizzbuzz(n):
    pass
#== tests ==
check("fizzbuzz(5)", fizzbuzz(5), ["1", "2", "Fizz", "4", "Buzz"])
check("15 lands on FizzBuzz", fizzbuzz(15)[14], "FizzBuzz")
check("every item is a string", all(isinstance(item, str) for item in fizzbuzz(20)), True)
check("fizzbuzz(0) is empty", fizzbuzz(0), [])
#== solution ==
def fizzbuzz(n):
    result = []
    for i in range(1, n + 1):
        if i % 15 == 0:
            result.append("FizzBuzz")
        elif i % 3 == 0:
            result.append("Fizz")
        elif i % 5 == 0:
            result.append("Buzz")
        else:
            result.append(str(i))
    return result
</script>

<script type="text/x-python" data-task="t6">
def second_largest(numbers):
    pass
#== tests ==
check("second_largest([3, 1, 4, 1, 5])", second_largest([3, 1, 4, 1, 5]), 4)
check("duplicates of the max do not count", second_largest([5, 5, 3]), 3)
check("all equal gives None", second_largest([2, 2, 2]), None)
check("empty list gives None", second_largest([]), None)
check("negatives work too", second_largest([-1, -2, -3]), -2)

def second_largest(numbers):
    distinct = sorted(set(numbers))
    if len(distinct) < 2:
        return None
    return distinct[-2]

<script type="text/x-python" data-task="t7">
def word_count(text):
    pass
#== tests ==
check("word_count('the cat the dog')", word_count("the cat the dog"), {"the": 2, "cat": 1, "dog": 1})
check("counting ignores case", word_count("Go go GO"), {"go": 3})
check("empty text gives an empty dict", word_count(""), {})
#== solution ==
def word_count(text):
    counts = {}
    for word in text.lower().split():
        counts[word] = counts.get(word, 0) + 1
    return counts
</script>

<script type="text/x-python" data-task="t8">
def group_by_first_letter(words):
    pass
#== tests ==
check("groups apple, avocado, beet", group_by_first_letter(["apple", "avocado", "beet"]), {"a": ["apple", "avocado"], "b": ["beet"]})
check("the key is lowercased", group_by_first_letter(["Ant", "ape"]), {"a": ["Ant", "ape"]})
check("empty strings are skipped", group_by_first_letter(["", "bee"]), {"b": ["bee"]})
check("no words gives an empty dict", group_by_first_letter([]), {})
#== solution ==
def group_by_first_letter(words):
    groups = {}
    for word in words:
        if not word:
            continue
        groups.setdefault(word[0].lower(), []).append(word)
    return groups
</script>

<script type="text/x-python" data-task="t9">
def dedupe(items):
    pass
#== tests ==
check("dedupe([3, 1, 3, 2, 1])", dedupe([3, 1, 3, 2, 1]), [3, 1, 2])
check("dedupe(['a', 'b', 'a'])", dedupe(["a", "b", "a"]), ["a", "b"])
check("an already unique list is unchanged", dedupe([1, 2, 3]), [1, 2, 3])
check("dedupe([])", dedupe([]), [])
#== solution ==
def dedupe(items):
    seen = set()
    result = []
    for item in items:
        if item not in seen:
            seen.add(item)
            result.append(item)
    return result
</script>

<script type="text/x-python" data-task="t10">
def is_palindrome(text):
    pass
#== tests ==
check("'A man, a plan, a canal: Panama'", is_palindrome("A man, a plan, a canal: Panama"), True)
check("'hello' is not a palindrome", is_palindrome("hello"), False)
check("an empty string counts", is_palindrome(""), True)
check("digits count too: '12321'", is_palindrome("12321"), True)
#== solution ==
def is_palindrome(text):
    cleaned = [ch.lower() for ch in text if ch.isalnum()]
    return cleaned == cleaned[::-1]
</script>

#== solution ==

    a, b = 0, 1
    for _ in range(n):
        a, b = b, a + b
    return a

class BankAccount:
    def __init__(self, owner, balance=0):
        self.owner = owner
        self.balance = balance

    def deposit(self, amount):
        if amount <= 0:
            raise ValueError("Deposit must be positive")
        self.balance += amount

    def withdraw(self, amount):
        if amount <= 0:
            raise ValueError("Withdrawal must be positive")
        if amount > self.balance:
            raise ValueError("Insufficient funds")
        self.balance -= amount

#== solution ==
class Stack:
    def __init__(self):
        self.items = []

    def push(self, item):
        self.items.append(item)

    def pop(self):
        if not self.items:
            raise IndexError("pop from empty stack")
        return self.items.pop()

    def peek(self):
        if not self.items:
            raise IndexError("peek from empty stack")
        return self.items[-1]

    def is_empty(self):
        return len(self.items) == 0

    def __len__(self):
        return len(self.items)

      window.brython({ debug: 0 });
    } catch (err) {
      errBuf += "The Python runtime stopped unexpectedly: " + err.message;
    }
    if (!finished) renderResults();
  }

  function renderResults() {
    var passed = rows.length > 0 && !errBuf && rows.every(function (r) { return r.ok; });

    var streamHtml = "";
    if (outBuf) streamHtml += escapeHtml(outBuf);
    if (errBuf) streamHtml += '<span class="trace">' + escapeHtml(errBuf) + "</span>";
    el.stream.innerHTML = streamHtml ||
      '<span class="placeholder">No output. Add a <code>print(...)</code> inside your function to watch what it does.</span>';

    if (rows.length) {
      el.checks.innerHTML = rows.map(function (r) {
        var detail = r.ok ? "" :
          '<div class="check-detail"><span><b>got</b> <span class="got">' + escapeHtml(r.got) +
          '</span></span><span><b>expected</b> <span class="want">' + escapeHtml(r.want) + "</span></span></div>";
        return '<div class="check ' + (r.ok ? "ok" : "no") + '"><span class="mark">' +
          (r.ok ? "✓" : "✗") + '</span><div><div class="check-label">' + escapeHtml(r.label) +
          "</div>" + detail + "</div></div>";
      }).join("");
    } else {
      el.checks.innerHTML = errBuf
        ? '<span class="placeholder">Python stopped before the checks could run. The message on the left says where.</span>'
        : '<span class="placeholder">No checks ran.</span>';
    }

    var passCount = rows.filter(function (r) { return r.ok; }).length;
    el.verdict.className = "verdict " + (passed ? "pass" : (rows.length || errBuf ? "fail" : ""));
    el.verdict.textContent = errBuf && !rows.length ? "error"
      : passed ? "all " + rows.length + " checks pass"
      : rows.length ? passCount + " of " + rows.length + " checks pass"
      : "not run yet";

    var record = entry(current);
    record.code = el.code.value;
    if (record.passed !== passed) {
      record.passed = passed;
      renderRail();
    }
    save();
  }

  /* ---------- task switching ---------- */
  function openTask(id) {
    if (!SOURCE[id]) id = TASKS[0].id;
    current = id;
    touched = false;
    var task = taskById(id);
    var saved = store.tasks[id];
    el.code.value = saved && saved.code ? saved.code : SOURCE[id].starter;
    renderGutter();
    renderBrief(task);
    renderRail();
    el.stream.innerHTML = '<span class="placeholder">Anything you <code>print()</code> shows up here.</span>';
    el.checks.innerHTML = pyFailed ? RUNTIME_OFF
      : saved && saved.passed
      ? '<span class="placeholder">You solved this one earlier. Run it again to confirm.</span>'
      : '<span class="placeholder">Press <b>Run &amp; check</b> to test your answer against the task.</span>';
    el.verdict.className = "verdict";
    el.verdict.textContent = "not run yet";
    save();
  }

  el.resetBtn.addEventListener("click", function () {
    el.code.value = SOURCE[current].starter;
    entry(current).code = "";
    renderGutter();
    renderRail();
    save();
    el.code.focus();
  });
  el.runBtn.addEventListener("click", run);

  /* ---------- boot the python runtime ---------- */
  var BASES = [
    "https://cdnjs.cloudflare.com/ajax/libs/brython/3.12.4/",
    "https://cdn.jsdelivr.net/npm/brython@3.12.4/",
    "https://cdn.jsdelivr.net/npm/brython@3/",
    "https://cdnjs.cloudflare.com/ajax/libs/brython/3.11.3/"
  ];

  function loadScript(url) {
    return new Promise(function (resolve, reject) {
      var node = document.createElement("script");
      var timer = setTimeout(function () { reject(new Error("timeout")); }, 20000);
      node.src = url;
      node.onload = function () { clearTimeout(timer); resolve(); };
      node.onerror = function () { clearTimeout(timer); reject(new Error("failed")); };
      document.head.appendChild(node);
    });
  }

  function bootPython() {
    var index = 0;
    function attempt() {
      if (index >= BASES.length) return Promise.resolve(false);
      var base = BASES[index++];
      return loadScript(base + "brython.min.js").then(function () {
        if (typeof window.brython !== "function") return attempt();
        return loadScript(base + "brython_stdlib.min.js")
          .catch(function () { /* core alone covers every task here */ })
          .then(function () { return true; });
      }).catch(attempt);
    }
    return attempt();
  }

  function markRuntime(state, text) {
    el.runtime.className = "runtime " + state;
    el.runtimeText.textContent = text;
  }

  /* ---------- start ---------- */
  if (!/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent)) {
    el.runBtn.querySelector("kbd").textContent = "Ctrl \u23CE";
  }

  readLocal();
  renderRail();
  openTask(current);
  initRemote();

  bootPython().then(function (ok) {
    pyReady = ok;
    if (ok) {
      el.runBtn.disabled = false;
      markRuntime("ready", "Python ready");
    } else {
      pyFailed = true;
      markRuntime("failed", "Python unavailable");
      el.checks.innerHTML = RUNTIME_OFF;
    }
  });
})();
</script>
