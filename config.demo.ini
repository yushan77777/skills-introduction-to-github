# Demo configuration — uses a local sqlite file instead of Greenplum.
# Run the app against it with:
#   python scripts/make_demo_data.py
#   MONITORING_CONFIG=config.demo.ini python manage.py runserver

[greenplum]
driver = sqlite
sqlite_path = demo_data/demo.sqlite

[tables]
disk_usage_table = server_disk_usage
disk_usage_hist_table = server_disk_usage_hist_cdc
