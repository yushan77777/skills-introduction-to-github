# =============================================================
# Monitoring Web App configuration
# =============================================================
# All external connection settings live here so nothing
# sensitive is hard-coded in the Django source.
#
# The app reads this file at startup. Override the path with the
# MONITORING_CONFIG environment variable if needed, e.g.:
#   MONITORING_CONFIG=/etc/monitoring/config.ini python manage.py runserver
# =============================================================

[greenplum]
# driver: which DB driver to use.
#   postgresql -> psycopg2 (Greenplum speaks the PostgreSQL protocol)
#   sqlite     -> local sqlite file (handy for demo / development)
driver = postgresql

# Connection details (used when driver = postgresql)
host = your-greenplum-host.internal
port = 5432
database = monitoring
username = gpadmin
password = change-me

# Optional: a full connection URL. If set, it takes precedence over
# the individual host/port/database/username/password fields above.
# url = postgresql://gpadmin:change-me@your-greenplum-host.internal:5432/monitoring

# Used when driver = sqlite (path is relative to the project root)
# sqlite_path = demo_data/demo.sqlite

# Connection timeout in seconds
connect_timeout = 10

[tables]
# Latest snapshot table (truncated + reloaded by the collector script)
disk_usage_table = server_disk_usage
# History table (CDC — only rows whose size changed are inserted)
disk_usage_hist_table = server_disk_usage_hist_cdc
