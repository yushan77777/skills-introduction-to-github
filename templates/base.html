{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ETL &amp; Monitoring Platform{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
  {% block styles %}{% endblock %}
  <script>
    // Apply saved theme before first paint to avoid a flash.
    (function () {
      var t = localStorage.getItem('monitor-theme');
      if (t === 'dark' || t === 'light') {
        document.documentElement.dataset.theme = t;
      }
    })();
  </script>
</head>
<body>
  <header class="topnav">
    <a class="brand" href="{% url 'portal:index' %}">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M4 13h4l2-6 4 12 2-6h4" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>ETL &amp; Monitoring</span>
    </a>
    <nav class="topnav-links">
      <a href="{% url 'home:index' %}" class="{% block nav_home %}{% endblock %}">Monitoring</a>
      <a href="{% url 'disk_usage:index' %}" class="{% block nav_disk %}{% endblock %}">Disk Usage</a>
      <a href="{% url 'etl:index' %}" class="{% block nav_etl %}{% endblock %}">ETL</a>
    </nav>
    <button id="theme-toggle" class="theme-toggle" type="button"
            title="Toggle light / dark theme" aria-label="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"
              stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <script>
    document.getElementById('theme-toggle').addEventListener('click', function () {
      var root = document.documentElement;
      var current = root.dataset.theme ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      var next = current === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      localStorage.setItem('monitor-theme', next);
      document.dispatchEvent(new CustomEvent('themechange'));
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
